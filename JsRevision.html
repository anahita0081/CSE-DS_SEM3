    <script>
    
        function runcode(){
            let no1=5;

        }
        function runcode2(){

            document.getElementById("result2").innerText="age type: " + typeof(age) + " | " + "name type: "+ typeof(name) 
            + " | " + "isStudent type: "+ typeof(isStudent) ;
        
        }
        function runcode3(){
            let marks=75;
            if(marks>=90){
                document.getElementById("result3").innerText="GRADE A";

        }
        function runcode4(){
            function addnumbers(x,y){
                return x+y;
            }
            let sum=addnumbers(5,7);
            document.getElementById("result4").innerText="the sum is:" + sum;
        }
        function runcode5(){
            let students=["Anahita" , "aryan" , "akshita"];

            let first=students[0];

            students.push("arpita");
            document.getElementById("result5").innerText="first:" + first +" | " + "second:" + second +" | ";
        }

        function runcode6(){
            let student={
                name:"anahita",
                age:18,
                marks:85
            };

            let studentName= student.name;
            let studentAge= student["age"];
            student.marks=90;

            document.getElementById("result6").innerText="name: " + studentName + " | " + "age: " + studentAge + " | " +
            "Updated Marks: " +  student.marks;

        }

        function runcode7(){
            document.getElementById("demoText").innerText="Hello,JS changed this text";
            document.getElementById("demoText").style.color="pink";

        }
         function setupEvent(){
            document.getElementById("click").addEventListener("click" , function(){
                alert("You clicked the button!");

            });
        }
        
        function runCode8() {
            let name = "Riya";
            let marks = 88;
            // old way: "Name: " + name + ", Marks: " + marks
            // new way: use backticks ` ` and ${ } to insert variables directly
            let message = `Name: ${name}, Marks: ${marks}`;
            // showing result on the page
            document.getElementById("result8").innerText = message;
        }
       function runCode10() {
            // class = blueprint to create similar objects easily
            class Student {
            // constructor runs when a new object is created
            constructor(name, marks) {
            this.name = name;
            this.marks = marks;
            }
            // a method (function) inside the class
            showResult() {
            return this.name + " scored " + this.marks;
            }
        }
                // creating a new object from the class
            let student1 = new Student("Karan", 78);
            // showing result on the page
            document.getElementById("result10").innerText = student1.showResult();
        }
    
    


    </script>
